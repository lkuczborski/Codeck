name: Codeck plugin

on:
  push:
    branches-ignore: [codex/plugin-distribution]
    paths:
      - '.github/workflows/codeck-plugin.yml'
      - '.agents/plugins/marketplace.json'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Sources/**'
      - 'Tests/**'
      - 'Resources/**'
      - 'plugins/codeck/**'
      - 'script/*plugin*'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/codeck-plugin.yml'
      - '.agents/plugins/marketplace.json'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Sources/**'
      - 'Tests/**'
      - 'Resources/**'
      - 'plugins/codeck/**'
      - 'script/*plugin*'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeck-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CODECK_PLUGIN_BUILD_NUMBER: ${{ github.run_number }}
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugins/codeck/package-lock.json
      - name: Check Swift toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build Swift targets
        timeout-minutes: 5
        run: swift build --jobs 3
      - name: Register packaged document types
        run: |
          script/build_and_run.sh --package
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f dist/Codeck.app
      - name: Run Swift tests
        timeout-minutes: 5
        run: swift test --jobs 3
      - name: Build plugin package
        run: script/build_plugin.sh
      - name: Check TypeScript and plugin integration
        working-directory: plugins/codeck
        env:
          CODECK_MCP_EXECUTABLE: ${{ github.workspace }}/dist/codeck-plugin/build/codeck-mcp
        run: |
          npm run typecheck
          npm test
      - name: Validate native bundle and archive executable permissions
        run: |
          test "$(uname -m)" = arm64
          codesign --verify --strict --verbose 'dist/codeck-plugin/build/Codeck Workspace.app'
          printf '%s\n' "${{ github.sha }}" > dist/SOURCE_COMMIT
          tar -czf dist/codeck-plugin-macos-arm64.tar.gz -C dist .agents codeck-plugin SOURCE_COMMIT
          shasum -a 256 dist/codeck-plugin-macos-arm64.tar.gz > dist/codeck-plugin-macos-arm64.tar.gz.sha256
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: codeck-plugin-macos-arm64
          path: |
            dist/codeck-plugin-macos-arm64.tar.gz
            dist/codeck-plugin-macos-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
